name: Sync WHO tuberculosis estimates
on:
  push:
    branches: [main]
    paths:
      - "scripts/update_who_tb.py"
      - "scripts/version_assets.py"
      - ".github/workflows/update-who-tb.yml"
  pull_request:
    paths:
      - "scripts/update_who_tb.py"
      - "scripts/version_assets.py"
      - ".github/workflows/update-who-tb.yml"
      - "tests/test_who_tb.py"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate without publishing WHO estimates"
        type: boolean
        default: true
      approve_review:
        description: "I reviewed the official WHO revision and approve flagged changes (main only)"
        type: boolean
        default: false
  schedule:
    - cron: "27 6 * * 1"
permissions:
  contents: read
concurrency:
  group: who-tb-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline WHO validation and failure/recovery tests
        run: python3 -m unittest discover -s tests -p 'test_who_tb*.py'
      - name: Cache hash integrity
        run: python3 scripts/version_assets.py
  live-dry-run:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && (github.ref != 'refs/heads/main' || inputs.dry_run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate current WHO CSVs without changing files
        run: python3 scripts/update_who_tb.py --dry-run
  sync:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize official WHO data (fail closed on revisions)
        env:
          REVIEW_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_review }}
        run: |
          if [ "$REVIEW_APPROVED" = "true" ]; then
            python3 scripts/update_who_tb.py --approve-review
          else
            python3 scripts/update_who_tb.py
          fi
      - name: Recompute static asset versions
        run: python3 scripts/version_assets.py --write
      - name: Verify all asset references
        run: python3 scripts/version_assets.py
      - name: Commit validated snapshot and matching HTML atomically
        run: |
          if ! git diff --quiet -- data/tb-data.js index.html feedback/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/tb-data.js index.html feedback/index.html
            git commit -m "Update validated WHO tuberculosis snapshot and asset versions"
            git push origin HEAD:main
          else
            echo "WHO snapshot and cache references unchanged; no commit."
          fi
