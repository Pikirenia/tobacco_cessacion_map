name: PR7 temporary landscape snapshot capture
on:
  push:
    branches: ['optimization-pr7-landscape-snapshots']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: bash scripts/baseline/install-deps.sh
      - run: npx playwright install --with-deps webkit
      - name: Generate ONLY the two missing landscape references
        shell: bash
        run: |
          set -euo pipefail
          branch=optimization-pr7-landscape-snapshots
          [ "${GITHUB_REF}" = "refs/heads/$branch" ]
          snapshots=tests/mobile/mobile.spec.cjs-snapshots
          npx playwright test -c playwright.mobile.config.cjs --project=mobile-webkit --grep '320 (light|dark) landscape visual layout' --update-snapshots
          for scheme in light dark; do
            test -s "$snapshots/320-$scheme-landscape-sharing-pr7-mobile-webkit-linux.png"
          done
          # Refuse unrequested changes to established snapshot files.
          other="$(git status --porcelain -- "$snapshots" | grep -v '320-.*-landscape-sharing-pr7-mobile-webkit-linux.png' || true)"
          if [ -n "$other" ]; then
            echo "Unexpected snapshot modifications: $other" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$snapshots/320-light-landscape-sharing-pr7-mobile-webkit-linux.png" "$snapshots/320-dark-landscape-sharing-pr7-mobile-webkit-linux.png"
          git diff --cached --quiet && { echo 'No new landscape references staged' >&2; exit 1; }
          git commit -m "test(pr7): add missing 320px WebKit landscape snapshots"
          git push origin HEAD:"$branch"
      - name: Verify both reference screenshots without update mode
        run: npx playwright test -c playwright.mobile.config.cjs --project=mobile-webkit --grep '320 (light|dark) landscape visual layout'
